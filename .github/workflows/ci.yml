name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panuelo
          POSTGRES_PASSWORD: panuelo
          POSTGRES_DB: panuelo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panuelo -d panuelo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://panuelo:panuelo@localhost:5432/panuelo_test?schema=public
      JWT_SECRET: ci-secret-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Tests unitarios
        run: npx jest --ci
      - name: Migraciones contra PostgreSQL
        run: npx prisma migrate deploy
      - name: Tests e2e
        run: npx jest --ci --config ./test/jest-e2e.json
      - name: Build
        run: npm run build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
