<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pañuelo sin efecto: el pañuelo amarillo del árbitro ondeando sobre el campo. -->
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="panuelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#campo)"/>

  <!-- Líneas de yarda -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="168" x2="472" y2="168"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="344" x2="472" y2="344"/>
    <line x1="40" y1="432" x2="472" y2="432"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="152" x2="256" y2="184"/>
    <line x1="256" y1="240" x2="256" y2="272"/>
    <line x1="256" y1="328" x2="256" y2="360"/>
    <line x1="256" y1="416" x2="256" y2="448"/>
  </g>

  <!-- Sombra del pañuelo -->
  <path d="M176 140 C 262 84, 330 190, 428 134 L 428 318 C 330 374, 262 268, 176 324 Z"
        fill="#000000" opacity="0.28" transform="translate(12 16)"/>

  <!-- Asta -->
  <line x1="160" y1="108" x2="160" y2="436" stroke="#000000" stroke-opacity="0.25" stroke-width="26" stroke-linecap="round" transform="translate(8 10)"/>
  <line x1="160" y1="108" x2="160" y2="436" stroke="#f8fafc" stroke-width="24" stroke-linecap="round"/>
  <circle cx="160" cy="94" r="22" fill="#f8fafc"/>

  <!-- Pañuelo -->
  <path d="M176 140 C 262 84, 330 190, 428 134 L 428 318 C 330 374, 262 268, 176 324 Z" fill="url(#panuelo)"/>
  <!-- Pliegue superior con luz -->
  <path d="M176 140 C 262 84, 330 190, 428 134 L 428 204 C 330 260, 262 154, 176 210 Z" fill="url(#brillo)"/>
  <!-- Pliegue inferior en sombra -->
  <path d="M176 262 C 262 206, 330 312, 428 256 L 428 318 C 330 374, 262 268, 176 324 Z" fill="#000000" opacity="0.12"/>
</svg>
